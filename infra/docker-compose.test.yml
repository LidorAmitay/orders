services:
  db:
    image: postgres:14
    environment:
      POSTGRES_DB: orderdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ../services/user-service
      dockerfile: Dockerfile
    environment:
      USER_DB_HOST: db
      USER_DB_PORT: 5432
      USER_DB_NAME: orderdb
      USER_DB_USER: postgres
      USER_DB_PASSWORD: postgres
    depends_on:
      db:
        condition: service_healthy

  order-service:
    build:
      context: ../services/order-service
      dockerfile: Dockerfile
    command: pytest -v
    environment:
      ORDER_DB_HOST: db
      ORDER_DB_PORT: 5432
      ORDER_DB_NAME: orderdb
      ORDER_DB_USER: postgres
      ORDER_DB_PASSWORD: postgres
      ORDER_USER_SERVICE_URL: http://user-service:8000
      ORDER_USER_SERVICE_TIMEOUT: 2.0
    depends_on:
      db:
        condition: service_healthy
      user-service:
        condition: service_started
